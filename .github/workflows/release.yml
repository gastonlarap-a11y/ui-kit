name: Release

# Only when something publishable changed. Docs-, config- and workflow-only commits
# cannot produce a release, so there is nothing for changesets to do.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".changeset/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing: npm exchanges this OIDC token for a
  # short-lived credential and attaches provenance. No long-lived npm token exists.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `registry-url` on purpose. It makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temp .npmrc, and
      # with no token secret that expands to the literal placeholder. npm then
      # authenticates with a bogus credential instead of exchanging the OIDC token,
      # and the registry answers 404 rather than 403 — a misleading error that looks
      # like the package does not exist. Trusted publishing needs no .npmrc entry.
      # See actions/setup-node#1551 and npm/cli#8976.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Trusted publishing requires npm >= 11.5.1; pinning avoids relying on
      # whatever version happens to ship with the Node release.
      - run: npm install -g npm@latest

      - run: npm ci

      # Opens (or updates) a "Version Packages" PR while changesets are pending, and
      # publishes once that PR is merged.
      #
      # Pinned to an exact tag, unlike the `@v7`/`@v6` neighbours above: this action
      # publishes no moving major ref at all. `v1` was a *branch*, and there is no `v2`
      # of either kind — `changesets/action@v2` does not resolve and fails the job. Bump
      # this by hand; do not "tidy" it into a major.
      #
      # v2 is what Changesets 3 requires, and it renamed every input to kebab-case.
      # `github-token` replaces the old `GITHUB_TOKEN` env var and already defaults to
      # `${{ github.token }}`, so it is left out rather than restated.
      - uses: changesets/action@v2.1.0
        with:
          version-script: npm run changeset:version
          publish-script: npm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
