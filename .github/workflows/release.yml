name: Release

# Only when something publishable changed. Docs-, config- and workflow-only commits
# cannot produce a release, so there is nothing for changesets to do.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".changeset/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing: npm exchanges this OIDC token for a
  # short-lived credential and attaches provenance. No long-lived npm token exists.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `registry-url` on purpose. It makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temp .npmrc, and
      # with no token secret that expands to the literal placeholder. npm then
      # authenticates with a bogus credential instead of exchanging the OIDC token,
      # and the registry answers 404 rather than 403 — a misleading error that looks
      # like the package does not exist. Trusted publishing needs no .npmrc entry.
      # See actions/setup-node#1551 and npm/cli#8976.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Trusted publishing requires npm >= 11.5.1; pinning avoids relying on
      # whatever version happens to ship with the Node release.
      - run: npm install -g npm@latest

      - run: npm ci

      # Opens (or updates) a "Version Packages" PR while changesets are pending, and
      # publishes once that PR is merged.
      - uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
