name: CI

# Pull requests only. `main` is protected, so nothing lands without passing here first —
# re-running the same commit after the merge would just spend a second runner to learn
# what we already know. Deployment and publishing are handled by docs.yml and release.yml.
on:
  pull_request:
    # A changeset or a README edit cannot break the build.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberately one job. Every extra job repeats checkout, setup-node and `npm ci`,
  # which costs more runner time than the checks themselves.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

      - name: Install Chromium for the browser-mode tests
        run: npx playwright install --with-deps chromium
      - run: npm run test

      # Validates module and type resolution against the real tarball, not the source.
      - run: npm run pack-check
      - run: npm run check:tarball

      # Cheap here, and it keeps a broken MDX or story from reaching main and taking
      # the Pages deployment down with it.
      - run: npm run build-storybook
